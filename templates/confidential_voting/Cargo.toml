[package]
name = "confidential_voting"
version = "0.2.0"
edition = "2024"
description = "Confidential voting template for Tari Ootle (stealth vote tokens, unlinkable ballots)"

[dependencies]
tari_template_lib = { version = "0.31" }

[dev-dependencies]
tari_template_test_tooling = "0.39"

# Keep the template a pure cdylib: with a second crate-type (rlib) present, rustc silently
# drops `-C lto` and the WASM grows (~76 KB on this template). Publish-size guidance lives in
# the workspace README (wasm-opt before publishing).
[lib]
crate-type = ["cdylib"]
